name: Release

# Push a semver tag (e.g. `v1.0.0`) to cut a release: this runs the full test
# suite against the tagged commit, builds the distribution artifact and publishes
# it as a DRAFT release. Promoting the draft is the deliberate gesture that lets
# the CaeloWorks update site ingest it.
on:
  push:
    tags: ['v*']

# Read-only by default: only the publishing job is given a write token.
permissions:
  contents: read

# Two tags pushed back to back must not race for the same release. Never cancel:
# a half-run publication is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Gate — the tag must be releasable
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA in this repo: a mutable tag in the
      # workflow that publishes is a dependency nobody here controls.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # merge-base needs the history, not just the tagged commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          }
      - name: Pure-logic tests (node)
        run: bash tests/run.sh
      - name: Packaging battery
        run: bash tests/packaging.sh

  release:
    name: Build and publish
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # This job holds the write token; nothing here talks to the remote over
          # git, so the token has no reason to sit in .git/config while the build
          # script runs.
          persist-credentials: false
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the distribution artifact
        run: bash scripts/build-update-package.sh "${{ steps.v.outputs.version }}"
      - name: Loose files for the manual install path
        run: |
          # The manual install needs the script AND the icon the dialog header
          # looks for beside it — that copy is the only one findable outside the
          # PixInsight tree. Extracted from the zip just built, so they carry the
          # same build stamp as the package.
          unzip -j dist/*.zip \
            'src/scripts/CaeloWorks/SessionCinema/SessionCinema.js' \
            'src/scripts/CaeloWorks/SessionCinema/SessionCinema.svg' \
            -d dist/manual
      - name: Publish release + assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The title the site will display, taken from the manifest rather than
          # rebuilt by slicing the zip file name — which drops the last dash-segment
          # and turns SessionCinema-1.2.0-rc1.zip into "SessionCinema-1.2.0".
          title="$(jq -r .title dist/update-package.json)"
          # A dash-suffixed version is a pre-release and must not be served as Latest.
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --draft \
            --generate-notes \
            $prerelease \
            dist/*.zip \
            dist/update-package.json \
            dist/manual/SessionCinema.js \
            dist/manual/SessionCinema.svg
