name: Release

# Push a semver tag (e.g. `v1.0.0`) to cut a release: this builds the distribution
# artifact and publishes it as release assets for the CaeloWorks update site to ingest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the distribution artifact
        run: bash scripts/build-update-package.sh "${{ steps.v.outputs.version }}"
      - name: Publish release + assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # The title the site will display, taken from the manifest rather than
          # rebuilt by slicing the zip file name — which drops the last dash-segment
          # and turns SessionCinema-1.2.0-rc1.zip into "SessionCinema-1.2.0".
          title="$(jq -r .title dist/update-package.json)"
          # A dash-suffixed version is a pre-release and must not be served as Latest.
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --generate-notes \
            $prerelease \
            dist/*.zip \
            dist/update-package.json
